name: ProctorX CI

on:
  push:
    branches: [main, 'feature/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

# Cancel superseded runs on the same ref
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ───────────────────────── Backend ─────────────────────────
  backend:
    name: Backend (lint, migrate, test)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write
      issues: write

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: proctorx_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test -d proctorx_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://test:test@localhost:5432/proctorx_test
      # Test-only value; never use a real secret in CI
      JWT_SECRET: ci-test-secret-key-minimum-32-chars!!
      FRONTEND_URL: http://localhost:5173
      ADMIN_USERNAME: admin
      ADMIN_PASSWORD: testpassword123
      MAX_WARNINGS: '5'
      EMAIL_HOST: smtp.test.local
      EMAIL_PORT: '587'
      EMAIL_USER: test@test.local
      EMAIL_PASS: testpass
      EMAIL_FROM: test@test.local

    defaults:
      run:
        working-directory: Back-End

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: Back-End/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Validate Prisma schema
        run: npx prisma validate

      - name: Apply database migrations
        run: npx prisma migrate deploy

      - name: Syntax check (fails on error)
        run: find src tests server.js -name '*.js' -print0 | xargs -0 -n1 node --check

      - name: Run tests with coverage
        run: npx jest --runInBand --forceExit --coverage

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: Back-End/coverage/
          if-no-files-found: ignore
          retention-days: 14

      - name: Comment coverage on PR
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const file = 'Back-End/coverage/coverage-summary.json';
            if (!fs.existsSync(file)) return core.info('No coverage summary found');
            const t = JSON.parse(fs.readFileSync(file, 'utf8')).total;
            const row = (name, m, min) =>
              `| **${name}** | ${m.pct}% | ${m.pct >= min ? '✅' : '❌'} (min ${min}%) |`;
            const marker = '<!-- proctorx-coverage -->';
            const body = [
              marker,
              '## 📊 Backend Test Coverage',
              '',
              '| Metric | Coverage | Status |',
              '|---|---|---|',
              row('Statements', t.statements, 60),
              row('Branches', t.branches, 50),
              row('Functions', t.functions, 60),
              row('Lines', t.lines, 60),
            ].join('\n');
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            // Update the existing comment instead of spamming a new one per push
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number });
            const existing = comments.find(c => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }

  # ───────────────────────── Frontend ─────────────────────────
  frontend:
    name: Frontend (lint, build)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        working-directory: Front-End

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: Front-End/package-lock.json

      - name: Install dependencies
        run: npm ci

      # Non-blocking until existing lint debt is cleared; output stays visible in logs
      - name: Lint
        run: npm run lint
        continue-on-error: true

      - name: Build
        run: npm run build
        env:
          VITE_API_URL: http://localhost:8000
          VITE_WS_URL: http://localhost:8000

  # ───────────────────────── Security ─────────────────────────
  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        project: [Back-End, Front-End]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # Report only high/critical production vulns; advisory, doesn't block merges
      - name: npm audit
        working-directory: ${{ matrix.project }}
        run: npm audit --omit=dev --audit-level=high
        continue-on-error: true
