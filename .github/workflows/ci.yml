name: ProctorX Backend CI

on:
  push:
    branches: [main, '08-07']
  pull_request:
    branches: [main]

permissions:
  pull-requests: write
  issues: write
  contents: read

env:
  NODE_ENV: test
  DATABASE_URL: postgresql://test:test@localhost:5432/proctorx_test
  JWT_SECRET: ${{ secrets.JWT_SECRET || 'ci-test-secret-key-minimum-32-chars!!' }}
  FRONTEND_URL: http://localhost:5173
  ADMIN_USERNAME: admin
  ADMIN_PASSWORD: testpassword123
  MAX_WARNINGS: '5'
  # Email config: optional in test mode (env.js provides defaults)
  EMAIL_HOST: smtp.test.local
  EMAIL_PORT: '587'
  EMAIL_USER: test@test.local
  EMAIL_PASS: testpass
  EMAIL_FROM: test@test.local

jobs:
  backend-test:
    name: 🧪 Backend API Route Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: proctorx_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: Back-End/package-lock.json

      - name: 📦 Install dependencies
        working-directory: Back-End
        run: npm ci

      - name: 🔧 Generate Prisma Client
        working-directory: Back-End
        run: npx prisma generate

      - name: 🗄️ Run database migrations
        working-directory: Back-End
        run: npx prisma migrate deploy
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/proctorx_test

      - name: 🔍 Syntax check (lint)
        working-directory: Back-End
        run: |
          echo "Checking JavaScript syntax..."
          find src tests -name '*.js' -exec node --check {} + 2>&1 || true
          echo "Syntax check complete."

      - name: 🧪 Run tests with coverage
        working-directory: Back-End
        run: npx jest --runInBand --forceExit --coverage --verbose
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/proctorx_test
          NODE_ENV: test
          JWT_SECRET: ci-test-secret-key-minimum-32-chars!!
          ADMIN_USERNAME: admin
          ADMIN_PASSWORD: testpassword123
          MAX_WARNINGS: '5'
          EMAIL_HOST: smtp.test.local
          EMAIL_PORT: '587'
          EMAIL_USER: test@test.local
          EMAIL_PASS: testpass
          EMAIL_FROM: test@test.local
          FRONTEND_URL: http://localhost:5173

      - name: 📊 Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: Back-End/coverage/
          retention-days: 14

      - name: 💬 Comment coverage on PR
        if: github.event_name == 'pull_request' && always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = 'Back-End/coverage/coverage-summary.json';

            if (!fs.existsSync(path)) {
              console.log('No coverage summary found');
              return;
            }

            const coverage = JSON.parse(fs.readFileSync(path, 'utf8'));
            const total = coverage.total;

            const body = `## 📊 Test Coverage Report

            | Metric | Coverage | Status |
            |--------|----------|--------|
            | **Statements** | ${total.statements.pct}% | ${total.statements.pct >= 70 ? '✅' : '❌'} |
            | **Branches** | ${total.branches.pct}% | ${total.branches.pct >= 60 ? '✅' : '❌'} |
            | **Functions** | ${total.functions.pct}% | ${total.functions.pct >= 70 ? '✅' : '❌'} |
            | **Lines** | ${total.lines.pct}% | ${total.lines.pct >= 70 ? '✅' : '❌'} |

            > Generated by ProctorX CI Pipeline`;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body
            });
